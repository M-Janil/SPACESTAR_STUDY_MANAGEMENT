<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#493264" />
      <stop offset="60%" stop-color="#2D1C44" />
      <stop offset="100%" stop-color="#181124" />
    </radialGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCCAFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFDDF0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2D1C44" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF0F8" />
      <stop offset="100%" stop-color="#D9EDFF" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDDF0" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#DCCAFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFDDF0" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Glow Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#haloGrad)" />

  <!-- Tilted Celestial Orbit Ring -->
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="210" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.85" />
  </g>

  <!-- Tiny Celestial Sparkles -->
  <circle cx="120" cy="140" r="6" fill="#FFF0F8" opacity="0.9" filter="url(#glow)" />
  <circle cx="390" cy="130" r="8" fill="#DCCAFF" opacity="0.9" filter="url(#glow)" />
  <circle cx="140" cy="380" r="5" fill="#FFDDF0" opacity="0.8" />
  <circle cx="370" cy="370" r="7" fill="#D9EDFF" opacity="0.9" filter="url(#glow)" />

  <!-- Central Radiant 4-Point Star -->
  <path d="M 256 64 C 256 180 200 256 64 256 C 200 256 256 332 256 448 C 256 332 312 256 448 256 C 312 256 256 180 256 64 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)" />

  <!-- Central Star Core Spark -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" />
</svg>
